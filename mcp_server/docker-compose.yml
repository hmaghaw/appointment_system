services:
  restaurant_mcp:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ../.env
    container_name: restaurant_mcp
    ports:
      - "7000:7000"
    volumes:
      - ./mcp_server:/app/mcp_server
    command: [ "python", "mcp_server/mcp_ws_server.py" ]
    restart: unless-stopped
