services:
  ngrok_appointment:
    image: ngrok/ngrok
    #command: http app:8000 --log=stdout  # Connect directly to app service
    command: http 192.168.1.3:5000 --log=stdout  # Connect directly to app service
    #command: http 192.168.100.155:8000 --log=stdout  # Connect directly to app service
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTH_TOKEN}
    #entrypoint: ["/bin/sh", "-c"]
    #command: ["http", "--log=stdout", "localhost:8000"]
    ports:
      - "4041:4040"  # ngrok web interface
      - "8081:8080"  # ngrok tunnel
    restart: unless-stopped
  # Main application database
  db:
    image: mysql:8.0
    container_name: appointment_db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: appointment_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/init/02-data.sql:/docker-entrypoint-initdb.d/02-data.sql
    restart: unless-stopped


