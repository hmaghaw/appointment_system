services:
  db:
    image: mysql:8.0
    container_name: appointment_db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: appointment_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - ../db_data:/var/lib/mysql
      - ./db/init/:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u$${MYSQL_USER}", "-p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile
    image: appointment_api:latest
    container_name: appointment_api
    working_dir: /app
    ports:
      - "5000:5000"
    environment:
      - PYTHONPATH=/app
      - DB_HOST=db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=appointment_db
      - FLASK_APP=appointment_app.app:app
      - FLASK_ENV=production
    volumes:
      - .:/app
    command: >
      sh -c "python create_env_file.py production &&
             cd /app/appointment_app && gunicorn --bind 0.0.0.0:5000 app:app"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

