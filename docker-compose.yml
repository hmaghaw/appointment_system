services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: appointment_api:latest
    container_name: appointment_api
    working_dir: /app
    ports:
      - "5000:5000"
    environment:
      - PYTHONPATH=/app
      - DB_NAME=appointment_db
      - FLASK_APP=appointment_app.app:app
      - FLASK_ENV=production
    volumes:
      - .:/app
    command: >
      sh -c "python create_env_file.py production &&
               cd /app/appointment_app &&
               gunicorn --bind 0.0.0.0:5000 --timeout 120 --workers 4 --threads 2 app:app"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  restaurant_mcp:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    env_file:
      - .env
    container_name: restaurant_mcp
    ports:
      - "7000:7000"
    volumes:
      - ./mcp_server/mcp_server:/app/mcp_server
    command: [ "python", "mcp_server/mcp_ws_server.py" ]
    depends_on:
      - api
    restart: unless-stopped