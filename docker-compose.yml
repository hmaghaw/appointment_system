services:
  db:
    image: mysql:8.0
    container_name: appointment_db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: appointment_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d

    restart: unless-stopped

