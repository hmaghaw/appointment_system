services:
  # Ngrok for exposing localhost
  # Github
  ngrok:
    image: ngrok/ngrok
    #command: http app:8000 --log=stdout  # Connect directly to app service
    command: http 192.168.1.108:5000 --log=stdout  # Connect directly to app service
    #command: http 192.168.100.155:8000 --log=stdout  # Connect directly to app service
    env_file:
      - ../.env
    #entrypoint: ["/bin/sh", "-c"]
    #command: ["http", "--log=stdout", "localhost:8000"]
    ports:
      - "4040:4040"  # ngrok web interface
      - "8080:8080"  # ngrok tunnel
    restart: unless-stopped

