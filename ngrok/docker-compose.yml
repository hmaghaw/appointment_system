services:
  ngrok_appointment:
    image: ngrok/ngrok
    #command: http app:8000 --log=stdout  # Connect directly to app service
    command: http 192.168.1.3:5000 --log=stdout  # Connect directly to app service
    #command: http 192.168.100.155:8000 --log=stdout  # Connect directly to app service
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTH_TOKEN}
    #entrypoint: ["/bin/sh", "-c"]
    #command: ["http", "--log=stdout", "localhost:8000"]
    ports:
      - "4041:4040"  # ngrok web interface
      - "8081:8080"  # ngrok tunnel
    restart: unless-stopped
